  <body>

<script>
  fetch("./text-files/biography.txt")
    .then((response) => response.text())
    .then((data) => {
      document.getElementById("bio").innerText = data;
    })
    .catch((error) => {
      console.error("Error fetching the file:", error);
    });
</script>
